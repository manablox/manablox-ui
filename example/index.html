<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manablox UI — Example</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    body {
      padding: 24px;
      background: #f6f7fb;
      color: #0b0b0b
    }

    html[data-mb-theme="dark"] body {
      background: #0b0b0f;
      color: #e8eef8
    }

    .container {
      max-width: 1000px;
      margin: 0 auto
    }

    h2 {
      font-size: 16px;
      margin: 18px 0
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center
    }

    .section {
      margin-bottom: 18px
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px
    }

    .muted {
      opacity: .8;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="toolbar">
      <button id="theme-toggle">Switch to Dark Mode</button>
      <div class="muted">Toggle dark mode (sets <code>data-mb-theme="dark"</code> on &lt;html&gt;)</div>
    </div>

    <div class="section">
      <h2>Severity variants</h2>
      <div class="row">
        <mb-button label="Default"></mb-button>
        <mb-button severity="secondary" label="Secondary"></mb-button>
        <mb-button severity="success" label="Success"></mb-button>
        <mb-button severity="info" label="Info"></mb-button>
        <mb-button severity="warning" label="Warning"></mb-button>
        <mb-button severity="danger" label="Danger"></mb-button>
      </div>
    </div>

    <div class="section">
      <h2>Modifiers</h2>
      <div class="row">
        <mb-button raised label="Raised"></mb-button>
        <mb-button rounded label="Rounded"></mb-button>
        <mb-button outlined label="Outlined"></mb-button>
        <mb-button text label="Text"></mb-button>
      </div>
    </div>

    <div class="section">
      <h2>Sizes</h2>
      <div class="row">
        <mb-button size="small" label="Small"></mb-button>
        <mb-button label="Normal"></mb-button>
        <mb-button size="large" label="Large"></mb-button>
      </div>
    </div>

    <div class="section">
      <h2>States</h2>
      <div class="row">
        <mb-button disabled label="Disabled"></mb-button>
        <mb-button loading label="Loading"></mb-button>
      </div>
    </div>
  </div>

  <div class="section">
    <mb-select options='[{"label":"Option A","value":"a"},{"label":"Option B","value":"b"}]' placeholder="Choose one"></mb-select>
  </div>

  <script type="module" src="./main.ts"></script>
</body>

</html>
